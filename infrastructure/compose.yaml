# infrastructure/compose.yaml
# Sobe PostgreSQL, FastAPI backend e Nginx (FastDL + proxy reverso)
# O servidor de jogo roda via systemd, não via Docker

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cs16}
      POSTGRES_USER:     ${POSTGRES_USER:-cs16_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    # Acesso via 127.0.0.1 apenas para os plugins do jogo no host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs16_admin} -d ${POSTGRES_DB:-cs16}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:      ${DATABASE_URL_BACKEND}
      SECRET_KEY:        ${SECRET_KEY}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../fastdl-public:/var/www/fastdl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - internal
      - external

volumes:
  postgres_data:
  nginx_logs:

networks:
  internal:
    driver: bridge
    internal: true   # sem acesso externo direto
  external:
    driver: bridge
