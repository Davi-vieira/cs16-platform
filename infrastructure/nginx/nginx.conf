worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/s;

    # ── FastDL ────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Apenas arquivos públicos de jogo — nunca addons, configs ou código
        root /var/www/fastdl;
        autoindex off;

        location /fastdl/ {
            alias /var/www/fastdl/;
            # Apenas extensões permitidas
            location ~* \.(bsp|bz2|mdl|wav|mp3|spr|tga|wad|res)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
            location ~ \.(php|py|sh|sql|env|cfg|ini)$ {
                return 403;
            }
        }

        # Redireciona tudo mais para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Backend API + Painel ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # API
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Login — rate limit mais restrito
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Webhooks de pagamento
        location /api/webhooks/ {
            limit_req zone=webhook burst=60 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Painel admin
        location / {
            proxy_pass       http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
